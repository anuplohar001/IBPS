<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Mental Math</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Mental Math</h1>
    <div class="controls">
      <label>Mode
        <select id="mode">
          <option value="add">Addition</option>
          <option value="sub">Subtraction</option>
          <option value="mul">Multiplication</option>
          <option value="hundred">100</option>
        </select>
      </label>
      <label>1st number digits
        <select id="d1">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label>2nd number digits
        <select id="d2">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
    </div>
    <div class="bar">
      <span id="progress">Answered 0/30</span>
      <button id="newSet" type="button" class="ghost">New 30</button>
    </div>
  </header>

  <main>
    <div id="questions" class="grid"></div>
    <button id="submit" type="button" class="primary">Submit</button>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="score">
      <div id="score" class="score"></div>
      <div id="detail" class="detail"></div>
      <button id="again" type="button" class="primary">Practice again</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
